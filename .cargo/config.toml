# The release executable is linked against the CRT static libraries
# (flag `+crt-static`): this way `thermite.exe` does not require the Microsoft Visual C++
# Redistributable on the target machine.
#
# It applies only to the Windows MSVC target; other platforms are unchanged.
# Remove this file to go back to the default dynamic linking.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
